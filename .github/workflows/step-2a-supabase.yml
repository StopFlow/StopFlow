name: StopFlow Step 2A Supabase

on:
  workflow_dispatch: {}
  push:
    branches:
      - stopflow-dev
    paths:
      - .github/workflows/step-2a-supabase.yml
      - .github/scripts/step_2a_patch.py

permissions:
  contents: write

jobs:
  integrate-supabase-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stopflow-dev
        uses: actions/checkout@v4
        with:
          ref: stopflow-dev
          fetch-depth: 0

      - name: Appliquer le correctif Supabase
        run: python3 .github/scripts/step_2a_patch.py

      - name: Vérifier la syntaxe JavaScript
        run: node --check /tmp/stopflow-inline.js

      - name: Vérifier et publier sur stopflow-dev
        run: |
          if git diff --quiet -- index.html; then
            echo "Aucune modification à publier."
            exit 0
          fi
          git config user.name "StopFlow Automation"
          git config user.email "contact@srlreunion.com"
          git add index.html
          git diff --cached --check
          git commit -m "Connecte l’authentification Supabase réelle (étape 2A)"
          git push origin HEAD:stopflow-dev

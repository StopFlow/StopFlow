name: Integrate StopFlow Checklists
on:
  push:
    branches: [stopflow-dev]
    paths: ['.github/workflows/integrate-checklists.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stopflow-dev
      - name: Inject checklist module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'stopflow-checklists.js' not in s:
              s=s.replace('</body>','<script src="stopflow-checklists.js?v=0112"></script>\n</body>')
          s=s.replace('Version 0.9.0 test — préparation StopFlow 1.0','Version 0.11.2 test — architecture et checklists')
          s=s.replace('Version 0.4.0 — Mobile, tablette et PWA','Version 0.11.2 test — architecture et checklists')
          p.write_text(s)
          PY
          node --check stopflow-checklists.js
          git config user.name 'StopFlow Automation'
          git config user.email 'contact@srlreunion.com'
          git add index.html
          git commit -m 'Active la nouvelle architecture et les checklists' || exit 0
          git push origin stopflow-dev
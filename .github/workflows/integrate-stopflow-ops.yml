name: Integrate StopFlow Ops
on:
  push:
    branches: [stopflow-dev]
    paths: ['.github/workflows/integrate-stopflow-ops.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stopflow-dev
      - name: Inject ops module and update version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'stopflow-ops.js' not in s:
              s=s.replace('<script src="stopflow-mobile.js?v=0400"></script>','<script src="stopflow-mobile.js?v=0400"></script>\n<script src="stopflow-ops.js?v=0900"></script>')
          s=s.replace('Version 0.4.0 — Mobile, tablette et PWA','Version 0.9.0 test — préparation StopFlow 1.0')
          p.write_text(s)
          PY
          node --check stopflow-ops.js
          git config user.name 'StopFlow Automation'
          git config user.email 'contact@srlreunion.com'
          git add index.html
          git commit -m 'Active les blocs D et E dans StopFlow' || exit 0
          git push origin stopflow-dev
